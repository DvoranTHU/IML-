project:
  name: "mli_lab"

seed: 42

data:
  root: "data"
  ravdess: "data/RAVDESS/Audio_Speech_Actors_01-24"
  crema_d: "data/CREMA-D/AudioWAV"
  emodb: "data/EMODB/wav"

outputs:
  metadata: "outputs/metadata"
  features: "outputs/features"
  metrics: "outputs/metrics"
  models: "outputs/models"

features:
  frame_length_ms: 25 # 窗长度
  hop_length_ms: 10 # 步长
  n_mfcc: 13 # mfcc维度
  include_delta: true # 包含一阶差分
  include_delta_delta: true # 包含二阶差分
  n_functionals: 8 # 8种统计量
  f0_fmin_hz: 80 # 基频最低频率
  f0_fmax_hz: 400 # 基频最高频率

audio:
  sample_rate: 16000 # 采样率
  mono: true # 单声道
  normalize: peak # 峰值归一化
  peak: 0.99 # 峰值
  min_duration_sec: 0.1 # 最小持续时间

eval:
  ravdess_n_folds: 5 # 5折交叉验证
  cross_corpus_classes: # 通用情感标签
    - angry
    - happy
    - sad
    - neutral
    - fearful
  bootstrap_n: 1000 # 自助法重复次数
  ci_level: 0.95 # 置信区间水平

models:
  gmm:
    n_components: [8, 16, 32, 64] # 高斯混合模型成分数
    covariance_type: diag # 协方差类型
    max_iter: 200 # 最大迭代次数
    tol: 0.0001 # 收敛阈值
    reg_covar: 0.000001 # 正则化协方差
    val_actor_ratio: 0.2 # 验证集演员比例
